:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --hair: #e1e0d9; --ring: rgba(11,11,11,0.10); --hover: rgba(11,11,11,0.04);
  --st-finished: #0ca30c; --st-mostly: #ec835a; --st-progress: #d03b3b; --st-dev: #8a7be8; --st-planned: #898781;
  --gray-dot: #a3a199;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948; --s-other: #3d3c39;
  --tiles: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --hair: #2c2c2a; --ring: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
    --gray-dot: #6b6a64;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --s-other: #d8d7d0;
    --tiles: dark;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --hair: #2c2c2a; --ring: rgba(255,255,255,0.10); --hover: rgba(255,255,255,0.05);
  --gray-dot: #6b6a64;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --s-other: #d8d7d0;
  --tiles: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.app { display: grid; grid-template-columns: 400px 1fr; height: 100vh; }
#map { height: 100%; background: var(--page); }
aside { background: var(--surface); border-right: 1px solid var(--hair); overflow-y: auto; padding: 20px 16px 24px; }
h1 { font-size: 17px; margin: 0 0 2px; font-weight: 650; }
h2 { font-size: 13px; margin: 20px 0 8px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
.sub { color: var(--muted); font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 14px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; flex: none; display: inline-block; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; border: 1.5px solid var(--surface); box-shadow: 0 0 0 1px var(--ring); }
.dot.small { width: 6px; height: 6px; border: 0; box-shadow: none; background: var(--gray-dot); }
.dot.none { background: transparent; border: 1.5px dashed var(--muted); box-shadow: none; }
.card { display: block; width: 100%; text-align: left; background: none; border: 1px solid var(--hair); border-radius: 8px;
        padding: 10px 12px; margin: 0 0 8px; color: inherit; font: inherit; cursor: pointer; }
.card:hover { background: var(--hover); }
.card .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card .cname { font-weight: 600; font-size: 15px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.bar { height: 6px; background: var(--hair); border-radius: 3px; margin: 8px 0 6px; overflow: hidden; display: flex; gap: 2px; }
.bar i { display: block; height: 100%; }
.stats { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.stats b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.back { background: none; border: 0; color: var(--ink-2); font: inherit; font-size: 13px; padding: 0; cursor: pointer; margin-bottom: 10px; }
.back:hover { color: var(--ink); }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th { text-align: left; font-weight: 500; color: var(--muted); padding: 4px 6px 4px 0; border-bottom: 1px solid var(--hair); }
td { padding: 5px 6px 5px 0; border-bottom: 1px solid var(--hair); vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.chainrow label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.chainrow input { margin: 0; accent-color: var(--ink-2); }
.state { color: var(--ink-2); }
.state small, .src { color: var(--muted); display: block; font-size: 11px; }
.state small.d { white-space: nowrap; }
.st-exported::before { content: "✓ "; color: var(--st-finished); }
.st-running::before { content: "● "; color: var(--st-progress); }
.st-collected::before { content: "◐ "; color: var(--st-mostly); }
.st-development::before { content: "○ "; color: var(--muted); }
.st-waiting::before { content: "◌ "; color: var(--st-progress); }
.st-pilot::before { content: "◔ "; color: var(--muted); }
.st-held::before { content: "‖ "; color: var(--muted); }
.st-unavailable::before { content: "– "; color: var(--muted); }
.steps { letter-spacing: 2px; white-space: nowrap; font-size: 13px; }
tr.dropped td { color: var(--muted); }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); margin: 10px 0 0; cursor: pointer; }
.others { font-size: 12px; color: var(--ink-2); }
.note { font-size: 12px; color: var(--ink-2); background: var(--hover); border-radius: 6px; padding: 8px 10px; margin-top: 10px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 16px; }
/* Leaflet tooltips in the page's tokens */
.leaflet-tooltip.tip { background: var(--surface); color: var(--ink); border: 1px solid var(--hair); border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,.14); padding: 10px 12px; font: 12px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
.leaflet-tooltip.tip::before { display: none; }
.tip.country { width: 560px; white-space: normal; }
.tip td.num { white-space: nowrap; }
.tip .t { font-weight: 600; font-size: 14px; display: flex; justify-content: space-between; gap: 10px; }
.tip td, .tip th { padding: 3px 8px 3px 0; }
.tip .more { color: var(--muted); margin-top: 6px; }
.leaflet-container { font: inherit; background: var(--page); }
.leaflet-control-attribution { font-size: 10px; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 55vh 45vh; }
  aside { order: 2; border-right: 0; border-top: 1px solid var(--hair); }
  .tip.country { width: 300px; }
}
</style>

}

// ---------------------------------------------------------------- sidebar
const side = document.getElementById("side");
let current = null;
function overview() {
  current = null;
  const counts = Object.fromEntries(STAGES.map(s => [s[0], D.countries.filter(c => c.stage === s[0]).length]));
  const order = Object.fromEntries(STAGES.map((s, i) => [s[0], i]));
  const list = D.countries.slice().sort((a, b) => order[a.stage] - order[b.stage] || a.name.localeCompare(b.name));
  side.innerHTML = `<h1>Supermarket data: collection progress</h1>
    <div class="sub">Generated ${esc(D.generated)} from the pipeline's output and the shared export folder</div>
    <div class="legend">${STAGES.filter(s => counts[s[0]] || s[0] !== "planned").map(s =>
      `<span><span class="sw" style="background:var(${s[2]})"></span>${s[1]} (${counts[s[0]]})</span>`).join("")}</div>
    <h2>Countries</h2>
    ${list.map(c => {
      const [, label, v] = stageOf(c.stage);
      return `<button class="card" data-cc="${c.cc}">
        <div class="row1"><span class="cname">${esc(c.name)}</span><span class="pill"><span class="sw" style="background:var(${v})"></span>${label}</span></div>
        ${c.build ? buildBar(c.build) : c.scope ? stageBar(c) : ""}
        <div class="stats">${c.build ? buildStats(c.build) : c.scope ? `<span><b>${c.exported}/${c.scope}</b> banners exported</span>` : `<span>${esc(c.note || "planned")}</span>`}
          ${c.priced_stores ? `<span><b>${fmt(c.priced_stores)}</b> stores with prices</span>` : ""}
          ${c.products ? `<span><b>${fmt(c.products)}</b> products</span>` : ""}</div>
      </button>`;
    }).join("")}
    <h2>On the map</h2>
    <div class="legend" style="margin-top:0;flex-direction:column;gap:6px">
      <span><span class="dot" style="background:var(--s1)"></span>Store with prices, coloured by banner</span>
      <span><span class="dot small"></span>Store without online prices</span>
      <span><span class="sw" style="background:var(--st-finished)"></span>Bar: exported · <span class="sw" style="background:var(--st-mostly)"></span>collected · <span class="sw" style="background:var(--st-progress)"></span>running</span>
      <span><span class="sw" style="background:var(--st-dev)"></span>Bar of a country in development: share of its scrapers built</span>
    </div>
    <div class="hint">Hover a country for its banners; click it or zoom in to see every store.</div>`;
  side.querySelectorAll(".card").forEach(b => b.onclick = () => select(D.countries.find(c => c.cc === b.dataset.cc), true));
}
function detail(c) {
  current = c;
  const [, label, v] = stageOf(c.stage);
  const rank = x => x.slot == null ? 99 : x.slot === "other" ? 50 : x.slot;
  const rows = scoped(c).slice().sort((a, b) => rank(a) - rank(b) || b.priced_stores - a.priced_stores);
  const others = otherBanners(c);
  const lastExport = c.last_export ? c.last_export.slice(0, 10) : "";
  side.innerHTML = `<button class="back">← All countries</button>
    <div class="row1" style="display:flex;justify-content:space-between;align-items:baseline">
      <h1>${esc(c.name)}</h1><span class="pill"><span class="sw" style="background:var(${v})"></span>${label}</span></div>
    ${c.note ? `<div class="note">${esc(c.note)}</div>` : ""}
    ${c.build ? `<h2>Scraper build</h2>${buildBar(c.build)}<div class="stats">${buildStats(c.build)}</div>
      <div style="margin-top:8px">${buildTable(c.build)}</div>` : ""}
    ${c.scope ? stageBar(c) : ""}
    <div class="stats">${c.scope ? `<span><b>${c.exported}/${c.scope}</b> banners exported</span>` : ""}
      ${c.running ? `<span><b>${c.running}</b> running</span>` : ""}
      ${c.stores ? `<span><b>${fmt(c.priced_stores)}</b> of ${fmt(c.stores)} stores with prices</span>` : ""}
      ${c.products ? `<span><b>${fmt(c.products)}</b> products</span>` : ""}
      ${lastExport ? `<span>last export <b>${esc(lastExport)}</b></span>` : ""}</div>
    ${rows.length ? `<h2>Banners</h2><table><tr><th>Banner</th><th class="num">Prices</th><th class="num">Products</th><th>Status</th></tr>
      ${rows.map(x => {
        const i = c.chains.indexOf(x), mapped = x.slot != null;
        const box = mapped ? `<input type="checkbox" data-i="${i}" ${c.show[i] === false ? "" : "checked"} aria-label="show ${esc(x.name)} on the map">` : "";
        return `<tr class="chainrow"><td><label>${box}${swatch(x)}<span>${esc(x.name)}<small class="src">${esc(x.source)}</small></span></label></td>
          <td class="num">${priceText(x)}</td><td class="num">${x.products ? fmt(x.products) : "–"}</td><td>${stateCell(x)}</td></tr>`;
      }).join("")}</table>
      ${rows.some(x => x.slot === "other") ? `<div class="hint" style="margin-top:6px">Smaller banners share the dark colour; hover a dot for its banner.</div>` : ""}` : ""}
    ${others.length ? `<h2>Banners without online prices</h2>
      <div class="others">${others.map(x => `${esc(x.name)} <span class="sub">${fmt(x.stores)}${x.state === "excluded" ? ", weekly offers only" : ""}</span>`).join(" · ")}</div>
      <label class="toggle"><input type="checkbox" id="gray" ${c.showGray ? "checked" : ""}> Show these stores (small gray dots)</label>` : ""}`;
  side.querySelector(".back").onclick = () => { overview(); map.flyToBounds(allBounds(), { duration: 0.8 }); };
  side.querySelectorAll("input[data-i]").forEach(b => b.onchange = () => { c.show[b.dataset.i] = b.checked; drawDots(); });
  const g = side.querySelector("#gray");
  if (g) g.onchange = () => { c.showGray = g.checked; drawDots(); };
}
function select(c, fly) {
  need(c);
  detail(c);
  if (fly && c.bounds) map.flyToBounds(c.bounds, { duration: 0.8, maxZoom: Math.max(DOT_ZOOM, map.getBoundsZoom(c.bounds)) });
}
function allBounds() {
  const b = D.countries.map(c => c.bounds).filter(Boolean);
  return b.reduce((acc, x) => acc.extend(x), L.latLngBounds(b[0].getSouthWest(), b[0].getNorthEast()));
}

map.on("zoomend", restyle);
map.on("moveend", () => {
  drawDots();
  if (map.getZoom() >= DOT_ZOOM) {                 // zoomed in: the sidebar follows the country in view
    // store areas overlap (Belgium lies within France's): keep the chosen country, else take the smallest area
    const ctr = map.getCenter(), hits = D.countries.filter(c => c.bounds && c.bounds.contains(ctr));
    const area = b => (b.getNorth() - b.getSouth()) * (b.getEast() - b.getWest());
    const c = hits.includes(current) ? current : hits.sort((a, b) => area(a.bounds) - area(b.bounds))[0];
    if (c && c !== current) detail(c);
  }
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  setTiles(); restyle(); drawDots();
  current ? detail(current) : overview();
});
overview();
if (D.countries.some(c => c.bounds)) map.fitBounds(allBounds(), { padding: [20, 20] });
</script>
</body>
</html>
